<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Carte mentale · Worklab Mindmap</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/editor.css">
</head>
<body class="editor">
  <header class="topbar editor-bar">
    <a id="back" class="btn ghost icon" href="/" title="Mes cartes" aria-label="Mes cartes">←</a>
    <img class="brand-logo hide-sm" src="/img/logo-worklab.png" alt="Worklab">
    <div id="map-title" class="map-title"></div>
    <span id="mode-badge" class="badge" hidden></span>
    <span class="spacer"></span>
    <div id="presence" class="presence"></div>
    <span id="sync-status" class="sync hide-sm">Enregistré</span>
    <button id="undo" class="btn ghost icon" title="Annuler (⌘Z)" aria-label="Annuler"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="redo" class="btn ghost icon" title="Rétablir (⇧⌘Z)" aria-label="Rétablir"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <div class="menu" id="export-menu">
      <button id="export-btn" class="btn" aria-haspopup="true">Exporter<span class="hide-sm"> ▾</span></button>
      <div class="menu-list" hidden>
        <button data-export="png">Image (PNG)</button>
        <button data-export="pdf">Document PDF</button>
        <button data-export="html">Page web (HTML)</button>
        <button data-export="xmind">Fichier XMind</button>
      </div>
    </div>
    <button id="share-btn" class="btn primary" hidden>Partager</button>
  </header>

  <div id="stage" class="stage">
    <div id="world" class="world">
      <svg id="links" class="links" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="nodes"></div>
    </div>
  </div>

  <aside id="panel" class="panel" hidden></aside>

  <div class="zoom-ctrl">
    <button id="zoom-out" class="btn ghost icon" title="Dézoomer" aria-label="Dézoomer">−</button>
    <span id="zoom-label">100%</span>
    <button id="zoom-in" class="btn ghost icon" title="Zoomer" aria-label="Zoomer">+</button>
    <button id="zoom-fit" class="btn ghost icon" title="Tout afficher" aria-label="Tout afficher">⤢</button>
  </div>
  <div id="hint" class="hint">
    <kbd>Tab</kbd> sous-branche · <kbd>Entrée</kbd> branche sœur · <kbd>Double-clic</kbd> modifier · <kbd>Suppr</kbd> effacer · glisser-déposer pour déplacer ou joindre des fichiers
  </div>
  <div id="loading" class="loading">Chargement de la carte…</div>
  <input type="file" id="file-input" hidden>

  <script src="/js/common.js"></script>
  <script src="/js/ops.js"></script>
  <script src="/js/export.js"></script>
  <script src="/js/editor.js"></script>
</body>
</html>
